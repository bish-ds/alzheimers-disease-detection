{% extends "base.html" %}
{% block content %}

<section class="predict-shell">
    <div class="predict-header">
        <h2>Alzheimer's Disease Classifier</h2>
    </div>

    <form id="upload-file" method="post" enctype="multipart/form-data" class="upload-panel">
        <label for="imageUpload" class="upload-label">Choose MRI Scan</label>
        <input type="file" name="file" id="imageUpload" accept=".png, .jpg, .jpeg">
    </form>

    <div class="image-section" style="display:none;">
        <div class="scan-grid">
            <figure class="scan-frame">
                <figcaption>Uploaded MRI</figcaption>
                <img id="originalImage" alt="Uploaded MRI preview">
            </figure>
            <figure class="scan-frame gradcam-frame" style="display:none;">
                <figcaption>Grad-CAM Overlay</figcaption>
                <img id="gradcamImage" alt="Grad-CAM heatmap overlay">
            </figure>
        </div>

        <button type="button" class="btn btn-primary btn-lg" id="btn-predict">
            Analyze Disease
        </button>
    </div>

    <div class="loader" style="display:none;"></div>

    <div id="result" class="result-panel" style="display:none;">
        <h3 id="resultLabel"></h3>
        <p id="resultConfidence"></p>
        <p id="resultDescription"></p>
        <p id="gradcamLayer" class="result-meta"></p>
    </div>
</section>

{% endblock %}
